ass="focus-text">小さく始めれば、ちゃんと進む。</div><div class="focus-foot">今日の空き時間から、まずは25分だけ。</div></div></div></section></main></div>

<script>
const STORAGE_KEY='michi-planner-v1',weekNames=['日','月','火','水','木','金','土'],today=(()=>{const date=new Date();date.setHours(0,0,0,0);return date})();
const startOfWeek=date=>{const result=new Date(date);result.setDate(result.getDate()-((result.getDay()+6)%7));result.setHours(0,0,0,0);return result},dateKey=date=>`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`,addDays=(date,amount)=>{const result=new Date(date);result.setDate(result.getDate()+amount);return result};
const defaultData={fixed:[{id:'f1',name:'ミクロ経済学',day:1,start:'09:00',end:'10:30',type:'class'},{id:'f2',name:'統計学',day:1,start:'13:00',end:'14:30',type:'class'},{id:'f3',name:'カフェのシフト',day:2,start:'17:00',end:'21:00',type:'work'},{id:'f4',name:'マーケティング論',day:3,start:'10:00',end:'11:30',type:'class'},{id:'f5',name:'サークル',day:3,start:'17:00',end:'19:00',type:'personal'},{id:'f6',name:'ゼミ',day:4,start:'13:00',end:'15:00',type:'class'},{id:'f7',name:'カフェのシフト',day:5,start:'16:00',end:'20:00',type:'work'},{id:'f8',name:'英語コミュニケーション',day:5,start:'10:00',end:'11:30',type:'class'},{id:'f9',name:'友人とランチ',day:6,start:'12:00',end:'14:00',type:'personal'}],tasks:[{id:'t1',name:'マーケティング論 レポート',due:'2026-10-05',hours:3,remaining:2,done:false},{id:'t2',name:'統計学 小テスト対策',due:'2026-10-02',hours:4,remaining:2,done:false},{id:'t3',name:'英語プレゼン資料',due:'2026-10-07',hours:2,remaining:1,done:false}],sessions:[{id:'s1',taskId:'t2',name:'統計学 小テスト対策',day:'2026-09-30',start:'14:00',end:'15:00',type:'study',done:false},{id:'s2',taskId:'t1',name:'マーケティング論 レポート',day:'2026-10-01',start:'09:00',end:'10:00',type:'study',done:false},{id:'s3',taskId:'t3',name:'英語プレゼン資料',day:'2026-10-02',start:'13:00',end:'14:00',type:'study',done:false}],extras:[]};
defaultData.tasks.forEach((task,index)=>{task.due=dateKey(addDays(today,[5,2,7][index]))});defaultData.sessions.forEach((session,index)=>{session.day=dateKey(addDays(today,[0,1,2][index]))});
let data;try{data=JSON.parse(localStorage.getItem(STORAGE_KEY))||structuredClone(defaultData)}catch{data=structuredClone(defaultData)}let weekStart=startOfWeek(today),dayMode=false;const grid=document.getElementById('calendarGrid');
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}function clockMinutes(time){const[hour,minute]=time.split(':').map(Number);return hour*60+minute}function slotTop(time){return(clockMinutes(time)-420)/60*45}function durationHours(start,end){return(clockMinutes(end)-clockMinutes(start))/60}function fmtDate(date){return`${date.getMonth()+1}月${date.getDate()}日`}function escapeHTML(value){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function renderMiniCalendar(){const el=document.getElementById('miniGrid'),days=['月','火','水','木','金','土','日'],first=new Date(today.getFullYear(),today.getMonth(),1),offset=(first.getDay()+6)%7,count=new Date(today.getFullYear(),today.getMonth()+1,0).getDate();document.querySelector('.mini-calendar .section-label').textContent=`${today.getFullYear()}年 ${today.getMonth()+1}月`;el.innerHTML=days.map(day=>`<span>${day}</span>`).join('')+Array.from({length:offset},()=>'<span></span>').join('')+Array.from({length:count},(_,i)=>`<span class="${i+1===today.getDate()?'today':''}">${i+1}</span>`).join('')}
function renderCalendar(){const days=dayMode?[today]:Array.from({length:7},(_,i)=>addDays(weekStart,i)),weekEnd=addDays(weekStart,6);document.getElementById('weekLabel').textContent=`${fmtDate(weekStart)} – ${fmtDate(weekEnd)}`;let html='<div class="corner"></div>'+days.map(date=>`<div class="day-head ${dateKey(date)===dateKey(today)?'today':''}"><span>${weekNames[date.getDay()]}曜日</span><strong>${date.getDate()}</strong></div>`).join('');for(let hour=7;hour<=22;hour++)html+=`<div class="time-label" style="top:${(hour-7)*45}px">${String(hour).padStart(2,'0')}:00</div>`;for(const date of days){const key=dateKey(date),blocks=[...data.fixed.filter(item=>item.day===date.getDay()),...data.extras.filter(item=>item.day===key),...data.sessions.filter(item=>item.day===key)];html+=`<div class="day-column" data-day="${key}">`;for(const item of blocks){const top=slotTop(item.start),height=Math.max(25,durationHours(item.start,item.end)*45-3);if(top<0||top>720)continue;const isSession=item.type==='study';html+=`<div class="event ${item.type} ${item.done?'done':''}" ${isSession?`data-session="${item.id}" title="クリックで完了切替"`:''} style="top:${top}px;height:${height}px"><div class="event-title">${escapeHTML(item.name)}</div><div class="event-time">${item.start} – ${item.end}</div></div>`}if(key===dateKey(today))html+=`<div class="now-line" style="top:${slotTop('10:30')}px"></div>`;html+='</div>'}grid.innerHTML=html;grid.style.gridTemplateColumns=dayMode?'48px minmax(300px,1fr)':'';grid.querySelectorAll('[data-session]').forEach(el=>el.addEventListener('click',()=>toggleSession(el.dataset.session)));renderMetrics()}
function getBlocks(date){const key=dateKey(date);return[...data.fixed.filter(item=>item.day===date.getDay()),...data.extras.filter(item=>item.day===key),...data.sessions.filter(item=>item.day===key&&!item.done)]}
function renderMetrics(){let free=0,planned=0;for(let i=0;i<7;i++){const date=addDays(weekStart,i),blocks=getBlocks(date);let busy=0,lastEnd=420;const sorted=blocks.map(x=>({start:clockMinutes(x.start),end:clockMinutes(x.end),type:x.type})).sort((a,b)=>a.start-b.start);for(const block of sorted){const start=Math.max(block.start,420),end=Math.min(block.end,1320);if(start>lastEnd)busy+=start-lastEnd;if(end>lastEnd)lastEnd=end;if(block.type==='study')planned+=Math.max(0,end-start)}free+=Math.max(0,1320-Math.max(lastEnd,420)-busy)}const nearDue=data.tasks.filter(task=>!task.done&&task.due>=dateKey(today)&&task.due<=dateKey(addDays(today,7)));document.getElementById('freeHours').textContent=`${Math.round(free/60)}時間`;document.getElementById('plannedHours').textContent=`${(planned/60).toFixed(planned%60===0?0:1)}時間`;document.getElementById('dueCount').textContent=`${nearDue.length}件`;document.getElementById('freeBadge').textContent=`今週の空き ${Math.round(free/60)}時間`}
function renderTasks(){const list=document.getElementById('taskList'),tasks=data.tasks.filter(task=>!task.done).sort((a,b)=>a.due.localeCompare(b.due));document.getElementById('taskCount').textContent=tasks.length;if(!tasks.length){list.innerHTML='<div class="empty-state">課題はすべて完了。いい調子です。</div>';return}list.innerHTML=tasks.slice(0,4).map(task=>`<div class="task-row"><input class="check" type="checkbox" aria-label="${escapeHTML(task.name)}を完了" data-task="${task.id}"><div class="task-info"><div class="task-title">${escapeHTML(task.name)}</div><div class="task-meta">残り約${task.remaining}時間 · ${fmtDate(new Date(`${task.due}T00:00:00`))}締め切り</div></div><div class="due">${Math.ceil((new Date(`${task.due}T00:00:00`)-today)/86400000)}日後</div></div>`).join('');list.querySelectorAll('[data-task]').forEach(el=>el.addEventListener('change',()=>{const task=data.tasks.find(item=>item.id===el.dataset.task);task.done=el.checked;data.sessions=data.sessions.filter(session=>session.taskId!==task.id);save();renderTasks();renderCalendar();showToast('課題を完了にしました')}))}
function toggleSession(id){const session=data.sessions.find(item=>item.id===id);if(!session)return;session.done=!session.done;const task=data.tasks.find(item=>item.id===session.taskId);if(task){const hours=durationHours(session.start,session.end);task.remaining=Math.max(0,task.remaining+(session.done?-hours:hours))}save();renderCalendar();renderTasks();showToast(session.done?'学習コマを完了にしました':'学習コマを未完了に戻しました')}
function createSchedule({reroute=false}={}){if(reroute)data.sessions=data.sessions.filter(session=>session.done||session.day<dateKey(today));const pending=data.tasks.filter(task=>!task.done&&task.remaining>0).sort((a,b)=>a.due.localeCompare(b.due));let placed=0,missed=0;for(const task of pending){const scheduled=data.sessions.filter(session=>session.taskId===task.id&&!session.done&&session.day>=dateKey(today)).reduce((sum,session)=>sum+durationHours(session.start,session.end),0);let remaining=Math.max(0,task.remaining-scheduled);const deadline=new Date(`${task.due}T00:00:00`);for(let date=new Date(today);date<=deadline&&remaining>0;date=addDays(date,1)){const blocks=getBlocks(date).map(item=>({start:clockMinutes(item.start),end:clockMinutes(item.end)})).sort((a,b)=>a.start-b.start);let cursor=540;const available=[];for(const block of blocks){if(block.start-cursor>=60)available.push([cursor,block.start]);cursor=Math.max(cursor,block.end)}if(1320-cursor>=60)available.push([cursor,1320]);for(const[start,end]of available){if(end-start<60)continue;const length=Math.min(60,remaining*60,end-start),startText=`${String(Math.floor(start/60)).padStart(2,'0')}:${String(start%60).padStart(2,'0')}`,endMinute=start+length,endText=`${String(Math.floor(endMinute/60)).padStart(2,'0')}:${String(endMinute%60).padStart(2,'0')}`;data.sessions.push({id:`s${Date.now()}${Math.random().toString(16).slice(2,6)}`,taskId:task.id,name:task.name,day:dateKey(date),start:startText,end:endText,type:'study',done:false});remaining-=length/60;placed++;break}}if(remaining>0)missed++}save();renderCalendar();renderTasks();showToast(missed?`${placed}コマを配置。${missed}件は空き時間が足りません`:`${placed}コマを空き時間に配置しました`)}
function showToast(message){const toast=document.getElementById('toast');toast.textContent=message;toast.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove('show'),2600)}function openModal(type='class'){document.getElementById('eventType').value=type;document.getElementById('dueField').hidden=type!=='task';document.getElementById('durationField').hidden=type!=='task';document.getElementById('modalTitle').textContent=type==='task'?'課題・テストを追加':'固定予定を追加';document.getElementById('modalBackdrop').classList.add('open');document.getElementById('eventName').focus()}function closeModal(){document.getElementById('modalBackdrop').classList.remove('open')}function setWeek(offset){weekStart=addDays(weekStart,offset*7);dayMode=false;document.getElementById('weekViewBtn').classList.add('active');document.getElementById('dayViewBtn').classList.remove('active');renderCalendar()}
document.getElementById('addBtn').addEventListener('click',()=>openModal());document.getElementById('fixedNav').addEventListener('click',()=>openModal('class'));document.getElementById('tasksNav').addEventListener('click',()=>openModal('task'));document.getElementById('allTasks').addEventListener('click',()=>openModal('task'));document.getElementById('closeModal').addEventListener('click',closeModal);document.getElementById('cancelModal').addEventListener('click',closeModal);document.getElementById('modalBackdrop').addEventListener('click',event=>{if(event.target.id==='modalBackdrop')closeModal()});document.getElementById('eventType').addEventListener('change',event=>{const task=event.target.value==='task';document.getElementById('dueField').hidden=!task;document.getElementById('durationField').hidden=!task;document.getElementById('modalTitle').textContent=task?'課題・テストを追加':'固定予定を追加'});
document.getElementById('eventForm').addEventListener('submit',event=>{event.preventDefault();const form=new FormData(event.currentTarget),type=form.get('type'),name=String(form.get('name')).trim(),start=form.get('start'),end=form.get('end');if(clockMinutes(end)<=clockMinutes(start)){showToast('終了時刻は開始時刻より後にしてください');return}if(type==='task'){const due=form.get('due'),hours=Number(form.get('duration'));if(!due||due<dateKey(today)){showToast('締め切りは今日以降の日付にしてください');return}data.tasks.push({id:`t${Date.now()}`,name,due,hours,remaining:hours,done:false});createSchedule()}else{const day=Number(form.get('day'));data.fixed.push({id:`f${Date.now()}`,name,day,start,end,type});save();renderCalendar();showToast('毎週の固定予定を追加しました')}closeModal();event.currentTarget.reset();document.getElementById('eventStart').value='13:00';document.getElementById('eventEnd').value='14:00'});
document.getElementById('prevWeek').addEventListener('click',()=>setWeek(-1));document.getElementById('nextWeek').addEventListener('click',()=>setWeek(1));document.getElementById('todayBtn').addEventListener('click',()=>{weekStart=startOfWeek(today);dayMode=false;document.getElementById('weekViewBtn').classList.add('active');document.getElementById('dayViewBtn').classList.remove('active');renderCalendar()});document.getElementById('rerouteBtn').addEventListener('click',()=>createSchedule({reroute:true}));document.getElementById('dayViewBtn').addEventListener('click',()=>{dayMode=true;document.getElementById('weekViewBtn').classList.remove('active');document.getElementById('dayViewBtn').classList.add('active');renderCalendar()});document.getElementById('weekViewBtn').addEventListener('click',()=>{dayMode=false;document.getElementById('weekViewBtn').classList.add('active');document.getElementById('dayViewBtn').classList.remove('active');renderCalendar()});renderMiniCalendar();renderCalendar();renderTasks();
</script><script>
const eventForm=document.getElementById('eventForm');
const eventGrid=document.querySelector('.form-grid');
const eventDayField=document.getElementById('eventDay').parentElement;
eventDayField.insertAdjacentHTML('beforebegin','<div class="field full" id="repeatField"><label for="eventRepeat">繰り返し</label><select id="eventRepeat" name="repeat"><option value="weekly" selected>毎週</option><option value="once">1回のみ</option></select></div>');
eventDayField.insertAdjacentHTML('afterend','<div class="field full" id="oneOffDateField" hidden><label for="oneOffDate">予定日</label><input id="oneOffDate" name="oneOffDate" type="date"></div>');
const repeatField=document.getElementById('repeatField');
const repeatSelect=document.getElementById('eventRepeat');
const oneOffDateField=document.getElementById('oneOffDateField');
const oneOffDate=document.getElementById('oneOffDate');
const eventTypeSelect=document.getElementById('eventType');
function syncEventScheduleFields(){const isTask=eventTypeSelect.value==='task',isOneOff=!isTask&&repeatSelect.value==='once';repeatField.hidden=isTask;eventDayField.hidden=isTask||isOneOff;oneOffDateField.hidden=!isOneOff;oneOffDate.required=isOneOff;oneOffDate.min=dateKey(today)}
function addOneOffEvent({name,type,day,start,end}){const item={id:`e${Date.now()}${Math.random().toString(16).slice(2,6)}`,name,day,start,end,type};data.extras.push(item);weekStart=startOfWeek(new Date(`${day}T00:00:00`));dayMode=false;document.getElementById('weekViewBtn').classList.add('active');document.getElementById('dayViewBtn').classList.remove('active');save();renderCalendar();return item}
repeatSelect.addEventListener('change',syncEventScheduleFields);
eventTypeSelect.addEventListener('change',syncEventScheduleFields);
for(const id of ['addBtn','fixedNav','tasksNav','allTasks'])document.getElementById(id).addEventListener('click',syncEventScheduleFields);
eventForm.addEventListener('submit',event=>{if(eventTypeSelect.value==='task'||repeatSelect.value!=='once')return;event.preventDefault();event.stopImmediatePropagation();const form=new FormData(event.currentTarget),name=String(form.get('name')).trim(),start=form.get('start'),end=form.get('end'),day=form.get('oneOffDate'),type=form.get('type');if(clockMinutes(end)<=clockMinutes(start)){showToast('終了時刻は開始時刻より後にしてください');return}if(!day||day<dateKey(today)){showToast('予定日は今日以降の日付にしてください');return}addOneOffEvent({name,type,day,start,end});closeModal();event.currentTarget.reset();document.getElementById('eventStart').value='13:00';document.getElementById('eventEnd').value='14:00';syncEventScheduleFields();showToast('1回のみの予定を追加しました')},true);
syncEventScheduleFields();
</script></body></html>
